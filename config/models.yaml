embeddings:
  sbert:
    model_name: "sentence-transformers/paraphrase-mpnet-base-v2"
    device: "auto"

  codebert:
    model_name: "microsoft/codebert-base"
    device: "auto"

  openai:
    provider: "openai"
    model_name: "text-embedding-3-small"
    api_key_env: "OPENAI_API_KEY"
